<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Farmer KYC & Banking Profile</h1>
      <p class="page-subtitle">Verify your identity and bank account for automated parametric payouts</p>
    </div>
    <div *ngIf="profile$ | async as prof">
      <span [appStatusBadge]="prof.verificationStatus">Verification: {{ prof.verificationStatus }}</span>
    </div>
  </div>

  <div class="card profile-card">
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="grid grid-cols-2">
        <div class="form-group">
          <label for="fullName">Full Legal Name *</label>
          <input id="fullName" type="text" class="form-control" formControlName="fullName" />
        </div>
        <div class="form-group">
          <label for="phoneNumber">Mobile Number *</label>
          <input id="phoneNumber" type="text" class="form-control" formControlName="phoneNumber" />
        </div>
      </div>
      <div class="form-group">
        <label for="addressLine">Street / Plot Address *</label>
        <input id="addressLine" type="text" class="form-control" formControlName="addressLine" />
      </div>
      <div class="grid grid-cols-4">
        <div class="form-group">
          <label for="village">Village *</label>
          <input id="village" type="text" class="form-control" formControlName="village" />
        </div>
        <div class="form-group">
          <label for="district">District *</label>
          <input id="district" type="text" class="form-control" formControlName="district" />
        </div>
        <div class="form-group">
          <label for="state">State *</label>
          <input id="state" type="text" class="form-control" formControlName="state" />
        </div>
        <div class="form-group">
          <label for="postalCode">PIN Code *</label>
          <input id="postalCode" type="text" class="form-control" formControlName="postalCode" />
        </div>
      </div>
      <div class="form-group">
        <label for="bankAccountLastFour">Bank Account Last 4 Digits *</label>
        <input id="bankAccountLastFour" type="text" maxlength="4" class="form-control" formControlName="bankAccountLastFour" />
      </div>
      <div class="card-footer">
        <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">Save KYC Profile</button>
      </div>
    </form>
  </div>
</div>
